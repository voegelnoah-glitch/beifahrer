# Versionen Stand Herbst 2026. Android Studio schlägt beim Öffnen Updates vor – einfach übernehmen.
[versions]
agp = "8.13.2"
kotlin = "2.2.10"
composeBom = "2025.09.00"
activityCompose = "1.10.1"
lifecycle = "2.9.2"
coreKtx = "1.16.0"
coroutines = "1.10.2"
navigationSdk = "7.9.0"      # Google Navigation SDK (Karte + Turn-by-Turn + Android Auto)
turnByTurn = "1.0.0"         # NavInfo-Daten für die Android-Auto-Vorlage
carApp = "1.7.0"             # Android for Cars App Library
places = "4.4.1"             # Zielsuche
desugar = "2.1.5"
junit = "4.13.2"
firebaseBom = "34.0.0"        # Firebase (Cloud-Datenbank für gemeinsame Gefahrenstellen)
geofire = "3.2.0"
credentials = "1.5.0"         # Google-Anmeldung
googleId = "1.1.1"
googleServices = "4.4.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
navigation-sdk = { group = "com.google.android.libraries.navigation", name = "navigation", version.ref = "navigationSdk" }
turnbyturn = { group = "com.google.android.libraries.mapsplatform.turnbyturn", name = "turnbyturn", version.ref = "turnByTurn" }
car-app = { group = "androidx.car.app", name = "app", version.ref = "carApp" }
car-app-projected = { group = "androidx.car.app", name = "app-projected", version.ref = "carApp" }
places = { group = "com.google.android.libraries.places", name = "places", version.ref = "places" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
credentials-play = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
geofire = { group = "com.firebase", name = "geofire-android-common", version.ref = "geofire" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
desugar-nio = { group = "com.android.tools", name = "desugar_jdk_libs_nio", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
