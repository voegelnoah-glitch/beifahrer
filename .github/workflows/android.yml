# Baut bei jeder Änderung automatisch die App (APK) und veröffentlicht sie als GitHub-Release.
# Die App auf dem Handy sieht das neue Release und bietet das Update an.
name: APK bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:        # auch per Knopf in GitHub startbar

permissions:
  contents: write           # nötig, um Releases anzulegen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Geheimnisse einsetzen (API-Schlüssel, Firebase, Signatur)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Secret KEYSTORE_PASSWORD fehlt (Settings → Secrets and variables → Actions)."; exit 1; fi
          if [ -z "$MAPS_API_KEY" ]; then echo "::warning::Secret MAPS_API_KEY fehlt – die App baut, zeigt aber keine Karte."; fi
          echo "MAPS_API_KEY=$MAPS_API_KEY" > local.properties
          # Firebase ist freiwillig: ohne google-services.json läuft die App ohne gemeinsame Gefahren-Cloud
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json; fi

      - name: Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: beifahrer
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Beifahrer.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Beifahrer 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Beifahrer.apk
          make_latest: true
